name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: types
        run: uv run mypy
      - name: tests
        run: uv run pytest
      - name: agent-config drift
        run: uv run python scripts/sync_agent_config.py --check
      - name: verify reference design
        run: uv run keel verify examples/gb200-1su/netlist.yaml

# Prescript netlist — GB200 NVL72, 1 Scalable Unit (8 racks), direct liquid cooling, 2N CDU
# Scope: the technology cooling loop (TCS). The facility water loop on the other side of the CDU
# exchanger is a boundary condition, given per mode as `conditions.facility_supply_c`.
# Rack count and IT power follow NVIDIA's public reference architecture (RA11338001); every
# cooling figure is marked `assumed` with a round number — this repository holds no vendor data.
# Grammar (v0.3):
#   nodes:   every cdu, pump, header, manifold and load is a node with a `kind`
#   edges:   directed the way the coolant travels; a `via` names the valve on that edge
#   ratings: kW / L/min / kPa as the spec gives them; a missing rating is `null`, never a guess
#   state:   open|closed for valves, on|off|standby for equipment; `modes` override these
#   procedures: an operating procedure as ordered steps; each step elaborates into the mode
#            "<procedure>@<step id>", so every assertion can be asked at every step
#   provenance: every node says where its numbers came from (a public source or "assumed")
#   Rule: the verifier never passes a check that touched a `null` rating; it reports UNRUN.

prescript: 0.3
project: GB200-1SU-DLC-POC
units: {heat: kW, flow: L/min, temperature: C, pressure: kPa, length: mm, time: s}

# ---------------------------------------------------------------- fluids ----
# Heat-carrying properties, used by every flow calculation: Q = V * rho * cp * dT.
fluids:
  pg25:
    cp_kj_kgk: 3.85
    density_kg_l: 1.03
    viscosity_mpas: 2.0
    provenance: "assumed: 25% propylene glycol / 75% water, round numbers at loop temperature"

# ---------------------------------------------------------------- blocks ----
# Parameterised standard blocks. Instances below are expanded from these.
blocks:
  cdu_loop:
    description: "One CDU with a duty and a standby pump, and its supply and return headers"
    # Temperature: the exchanger's approach and the return range it is selected for.
    # Pressure: the pump's rated head, the exchanger's rated drop at its rated flow, and each
    # header as pipe (bore, run length, roughness, summed fitting K) for Darcy-Weisbach.
    # Inventory: `volume_l` per element; a header's comes from its bore and run, so it has none.
    # Dynamics (`prescript sim`, docs/SIMULATION.md): the pump curve's shut-off head, the NPSH the
    # pump requires at its rated flow and its speed ramp; the expansion tank's fill pressure at the
    # CDU inlet; the facility-water flow and secondary supply setpoint of the exchanger; the
    # header's pressure-wave speed and design pressure; the stroke time of the pump valves.
    params: {rating_kw: 1500, rating_lpm: 2300, approach_k: 3, return_min_c: 25, return_max_c: 50,
             head_kpa: 250, cdu_dp_kpa: 50, dn_mm: 150, header_m: 30, header_k: 5,
             roughness_mm: 0.045, pump_valve_kv: 600, cdu_volume_l: 200, pump_volume_l: 10,
             shutoff_kpa: 320, npshr_m: 3, ramp_s: 5, fill_kpa: 100, facility_lpm: 2600, supply_c: 30,
             wave_speed_m_s: 1200, design_kpa: 1000, pump_valve_stroke_s: 30}
    provenance: "assumed (S-20): round numbers, no vendor data in this repository"
    expands_to:
      - {id: "CDU-{s}", kind: cdu, rating_kw: "{rating_kw}", rating_lpm: "{rating_lpm}", approach_k: "{approach_k}", return_min_c: "{return_min_c}", return_max_c: "{return_max_c}", dp_kpa: "{cdu_dp_kpa}", dp_lpm: "{rating_lpm}", volume_l: "{cdu_volume_l}", fill_kpa: "{fill_kpa}", facility_lpm: "{facility_lpm}", supply_c: "{supply_c}", side: "{s}", fluid: pg25}
      - {id: "PMP-{s}-1", kind: pump, rating_lpm: "{rating_lpm}", rating_kpa: "{head_kpa}", shutoff_kpa: "{shutoff_kpa}", npshr_m: "{npshr_m}", ramp_s: "{ramp_s}", volume_l: "{pump_volume_l}"}
      - {id: "PMP-{s}-2", kind: pump, rating_lpm: "{rating_lpm}", rating_kpa: "{head_kpa}", shutoff_kpa: "{shutoff_kpa}", npshr_m: "{npshr_m}", ramp_s: "{ramp_s}", volume_l: "{pump_volume_l}", state: standby, standby_of: "PMP-{s}-1"}
      - {id: "HDR-S-{s}", kind: header, rating_lpm: "{rating_lpm}", dn_mm: "{dn_mm}", length_m: "{header_m}", roughness_mm: "{roughness_mm}", k_fittings: "{header_k}", wave_speed_m_s: "{wave_speed_m_s}", design_kpa: "{design_kpa}", service: supply, fluid: pg25}
      - {id: "HDR-R-{s}", kind: header, rating_lpm: "{rating_lpm}", dn_mm: "{dn_mm}", length_m: "{header_m}", roughness_mm: "{roughness_mm}", k_fittings: "{header_k}", wave_speed_m_s: "{wave_speed_m_s}", design_kpa: "{design_kpa}", service: return, fluid: pg25}
    edges:
      - {from: "CDU-{s}", to: "PMP-{s}-1", via: {id: "V-PMP-{s}-1", kind: valve, kv_m3h: "{pump_valve_kv}", stroke_s: "{pump_valve_stroke_s}", provenance: "assumed: round number"}}
      - {from: "CDU-{s}", to: "PMP-{s}-2", via: {id: "V-PMP-{s}-2", kind: valve, kv_m3h: "{pump_valve_kv}", stroke_s: "{pump_valve_stroke_s}", provenance: "assumed: round number"}}
      - {from: "PMP-{s}-1", to: "HDR-S-{s}"}
      - {from: "PMP-{s}-2", to: "HDR-S-{s}"}
      - {from: "HDR-R-{s}", to: "CDU-{s}"}

  rack_gb200_nvl72:
    description: "GB200 NVL72 rack, cold-plate cooled, dual-fed from the A and B rack manifolds"
    # Pressure: the manifold's rated drop at its rated flow, the rack's (cold plates lumped) at a
    # stated flow, and the Kv of each branch valve.
    params: {heat_kw: 150, delta_t_k: 10, max_inlet_c: 45, manifold_lpm: 300, manifold_dp_kpa: 30,
             rack_dp_kpa: 100, rack_dp_lpm: 230, branch_kv: 60,
             manifold_volume_l: 20, rack_volume_l: 60}
    provenance: "NVIDIA RA RA11338001: ~1.2 MW IT across 8 racks. Cooling figures assumed (S-21)."
    expands_to:
      - {id: "MAN-A-{n}", kind: manifold, rating_lpm: "{manifold_lpm}", dp_kpa: "{manifold_dp_kpa}", dp_lpm: "{manifold_lpm}", volume_l: "{manifold_volume_l}", ports: 8, side: A, fluid: pg25}
      - {id: "MAN-B-{n}", kind: manifold, rating_lpm: "{manifold_lpm}", dp_kpa: "{manifold_dp_kpa}", dp_lpm: "{manifold_lpm}", volume_l: "{manifold_volume_l}", ports: 8, side: B, fluid: pg25}
      - {id: "RACK-{n}", kind: rack, class: it_liquid, heat_kw: "{heat_kw}", delta_t_k: "{delta_t_k}", max_inlet_c: "{max_inlet_c}", dp_kpa: "{rack_dp_kpa}", dp_lpm: "{rack_dp_lpm}", volume_l: "{rack_volume_l}", dual_fed: true, fluid: pg25}
    edges:
      - {from: "HDR-S-A", to: "MAN-A-{n}", via: {id: "V-SA-{n}", kind: valve, kv_m3h: "{branch_kv}", provenance: "assumed: round number"}}
      - {from: "HDR-S-B", to: "MAN-B-{n}", via: {id: "V-SB-{n}", kind: valve, kv_m3h: "{branch_kv}", provenance: "assumed: round number"}}
      - {from: "MAN-A-{n}", to: "RACK-{n}", share: 0.5}
      - {from: "MAN-B-{n}", to: "RACK-{n}", share: 0.5}
      - {from: "RACK-{n}", to: "HDR-R-A", via: {id: "V-RA-{n}", kind: valve, kv_m3h: "{branch_kv}", provenance: "assumed: round number"}, share: 0.5}
      - {from: "RACK-{n}", to: "HDR-R-B", via: {id: "V-RB-{n}", kind: valve, kv_m3h: "{branch_kv}", provenance: "assumed: round number"}, share: 0.5}

# ---------------------------------------------------------------- nodes -----
nodes:
  # CDUs and their headers (expanded from cdu_loop, s = A|B), 2N
  - {use: cdu_loop, s: A}
  - {use: cdu_loop, s: B}

  # Racks (expanded from rack_gb200_nvl72, n = 01..08)
  - {use: rack_gb200_nvl72, n: "01"}
  - {use: rack_gb200_nvl72, n: "02"}
  - {use: rack_gb200_nvl72, n: "03"}
  - {use: rack_gb200_nvl72, n: "04"}
  - {use: rack_gb200_nvl72, n: "05"}
  - {use: rack_gb200_nvl72, n: "06"}
  - {use: rack_gb200_nvl72, n: "07"}
  - {use: rack_gb200_nvl72, n: "08"}

  # Residual air-cooled load of the hall (switching, PSU losses) on rear-door exchangers (S-22)
  - {id: RDHX-01, kind: rdhx, class: it_air, heat_kw: 120, delta_t_k: 10, max_inlet_c: 40, dp_kpa: 50, dp_lpm: 180, volume_l: 40, dual_fed: true, fluid: pg25, provenance: "assumed: 10% of IT power stays in air; drop and volume round numbers"}

# ---------------------------------------------------------------- edges -----
edges:
  # Rear-door exchangers hang off both supply headers and return to both return headers
  - {from: HDR-S-A, to: RDHX-01, via: {id: V-SA-RDHX, kind: valve, kv_m3h: 60, provenance: "assumed: round number"}, share: 0.5}
  - {from: HDR-S-B, to: RDHX-01, via: {id: V-SB-RDHX, kind: valve, kv_m3h: 60, provenance: "assumed: round number"}, share: 0.5}
  - {from: RDHX-01, to: HDR-R-A, via: {id: V-RA-RDHX, kind: valve, kv_m3h: 60, provenance: "assumed: round number"}, share: 0.5}
  - {from: RDHX-01, to: HDR-R-B, via: {id: V-RB-RDHX, kind: valve, kv_m3h: 60, provenance: "assumed: round number"}, share: 0.5}

# ---------------------------------------------------------------- modes -----
# Each mode overrides equipment and valve states, sets the facility-side boundary condition and
# applies demand factors per load class.
modes:
  normal:
    overrides: {}
    demand: {it_liquid: 1.0, it_air: 1.0}
    conditions: {facility_supply_c: 20}
  maint-cdu-A:
    overrides: {CDU-A: off}
    demand: {it_liquid: 1.0, it_air: 1.0}
    conditions: {facility_supply_c: 20}
    note: "Concurrent maintainability: CDU-A isolated, CDU-B carries the whole hall"
  maint-cdu-B:
    overrides: {CDU-B: off}
    demand: {it_liquid: 1.0, it_air: 1.0}
    conditions: {facility_supply_c: 20}
  pump-fail-A:
    overrides: {PMP-A-1: off, PMP-A-2: on}
    demand: {it_liquid: 1.0, it_air: 1.0}
    conditions: {facility_supply_c: 20}
    note: "N+1: the duty pump of CDU-A stops and the standby takes the load"
  summer-peak:
    overrides: {}
    demand: {it_liquid: 1.0, it_air: 1.0}
    conditions: {facility_supply_c: 32}
    note: "Facility water at its design maximum"
  valve-shut-01:
    overrides: {V-SA-01: closed}
    demand: {it_liquid: 1.0, it_air: 1.0}
    conditions: {facility_supply_c: 20}
    note: "One rack branch isolated on side A — worst flow imbalance case"
  facility-loss:
    overrides: {CDU-A: off, CDU-B: off}
    demand: {it_liquid: 0.1, it_air: 0.0}
    # loop_start_c: the water in the loop when the heat sink goes, not the facility side. Assumed
    # as the mean of this design's own normal operating pair: 23 C to the racks (20 + 3 K approach)
    # and 33 C back (+ 10 K across a rack).
    conditions: {facility_supply_c: 45, loop_start_c: 28}
    note: "Facility water lost and both CDUs trip; how long until the GPUs must throttle"

# ------------------------------------------------------------ procedures ----
# An operating procedure, written step by step. Each step is a delta on the one before it,
# starting from `from`, and elaborates into an ordinary mode (`stop-cdu-A@s1` ... `@s4`) with the
# start mode's demand and conditions. `holds` asks those assertions at every step, so the report
# shows where in the procedure a margin is lost, not only at the end state (`maint-cdu-A`).
# Timing: every `after_s` and `within_s` below is assumed — round numbers, no vendor or site
# procedure behind them. Static checks ignore both; they are recorded for the simulator.
# `done_when` is an assumption about plant feedback: carried into the report, never evaluated.
procedures:
  stop-cdu-A:
    from: normal
    intent: "Planned maintenance on CDU-A; the hall runs on CDU-B throughout"
    holds: [C-01, C-05, C-06]
    steps:
      - id: s1
        action: "Inhibit the standby pump"
        set: {PMP-A-2: off}
        after_s: 30
        done_when: {assume: "standby start inhibited at the controller", provenance: "assumed"}
      - id: s2
        action: "Stop the duty pump"
        set: {PMP-A-1: off}
        after_s: 30
        done_when: {assume: "loss of pump running feedback", provenance: "assumed"}
      - id: s3
        action: "Stop the CDU"
        set: {CDU-A: off}
        after_s: 60
      - id: s4
        action: "Isolate the pump branches"
        set: {V-PMP-A-1: closed, V-PMP-A-2: closed}
        after_s: 60
        within_s: 60

# ------------------------------------------------------------------ spec ----
# The sheets this design was taken from, transcribed. `consistency` proves the elaborated netlist
# still agrees with them: the racks come out of a block, so one parameter edit moves all eight at
# once and only the schedule notices.
spec:
  02_Loads:
    provenance: "NVIDIA RA RA11338001 (S-21/S-22): the load schedule this netlist was built from; cooling figures assumed"
    rows:
      - {id: RACK-01, heat_kw: 150, delta_t_k: 10, max_inlet_c: 45}
      - {id: RACK-02, heat_kw: 150, delta_t_k: 10, max_inlet_c: 45}
      - {id: RACK-03, heat_kw: 150, delta_t_k: 10, max_inlet_c: 45}
      - {id: RACK-04, heat_kw: 150, delta_t_k: 10, max_inlet_c: 45}
      - {id: RACK-05, heat_kw: 150, delta_t_k: 10, max_inlet_c: 45}
      - {id: RACK-06, heat_kw: 150, delta_t_k: 10, max_inlet_c: 45}
      - {id: RACK-07, heat_kw: 150, delta_t_k: 10, max_inlet_c: 45}
      - {id: RACK-08, heat_kw: 150, delta_t_k: 10, max_inlet_c: 45}
      - {id: RDHX-01, heat_kw: 120, delta_t_k: 10, max_inlet_c: 40}

# ------------------------------------------------------------ assertions ----
# `check` names a built-in verifier routine; unimplemented ones report UNRUN.
assertions:
  - {id: C-01, check: loop_closed,   args: {class: it_liquid},                                  modes: [normal, pump-fail-A, summer-peak, valve-shut-01]}
  # C-03: maintenance takes one CDU down on purpose, so those modes ask for one closed loop
  # instead of two; C-02 (both sides live) is asserted only where both sides are expected.
  - {id: C-02, check: dual_path,     args: {class: it_liquid, sides: [A, B]},                   modes: [normal, pump-fail-A, summer-peak]}
  - {id: C-03, check: loop_closed,   args: {class: it_liquid},                                  modes: [maint-cdu-A, maint-cdu-B]}
  - {id: C-04, check: loop_closed,   args: {class: it_air},                                     modes: [normal]}
  # C-05: `loading` only means something where something flows. `facility-loss` stops both
  # CDUs, so that mode has no circulating load to accumulate and the cell could never leave
  # UNRUN — it is asserted by C-11 (ride_through) instead. Keeping it in `all` would cap
  # coverage below the 100% the roadmap asks for in W3.
  - {id: C-05, check: loading,       args: {basis: flow, kinds: [cdu, pump, header, manifold], limit: 1.0}, modes: [normal, maint-cdu-A, maint-cdu-B, pump-fail-A, summer-peak, valve-shut-01]}
  - {id: C-06, check: loading,       args: {basis: heat, kinds: [cdu], limit: 1.0},             modes: [normal, maint-cdu-A, maint-cdu-B, summer-peak]}
  - {id: C-07, check: inlet_temp,    args: {class: it_liquid},                                  modes: [normal, summer-peak]}
  - {id: C-08, check: n_minus_1,     args: {class: it_liquid, sweep: [cdu, pump, header, manifold]}, modes: [normal]}
  - {id: C-09, check: pressure_drop, args: {method: darcy_weisbach},                         modes: [normal, valve-shut-01]}
  - {id: C-10, check: balance,       args: {class: it_liquid, tolerance_pct: 10},               modes: [normal, valve-shut-01]}
  - {id: C-11, check: ride_through,  args: {class: it_liquid, must_exceed_s: 60},               modes: [facility-loss], severity: warn}
  - {id: C-12, check: return_temp,   args: {kinds: [cdu]},                                      modes: [normal, summer-peak]}
  - {id: C-13, check: consistency,   args: {against: "02_Loads", fields: [heat_kw, delta_t_k, max_inlet_c]}, modes: [static]}
  - {id: C-14, check: completeness,  args: {kinds: [cdu, pump, header, manifold, valve]},       modes: [static], severity: warn}
  - {id: C-15, check: coverage,      args: {modes: all, assertions: [C-01, C-05]},              modes: [meta], severity: warn}
  # C-16: a leak on any rack branch is valved off by its own ring (V-SA/SB/RA/RB-nn) and stops no
  # other load — including while one CDU is down for maintenance.
  - {id: C-16, check: leak_isolation, args: {class: it_liquid},                                modes: [normal, maint-cdu-A, maint-cdu-B]}

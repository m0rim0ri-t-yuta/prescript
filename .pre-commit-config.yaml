repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      # Uses the installed gitleaks binary; the upstream hook builds from Go source (#2).
      - id: gitleaks
        name: gitleaks (staged)
        entry: scripts/precommit_gitleaks.sh
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: agent-config-drift
        name: agent-config drift
        entry: uv run python scripts/sync_agent_config.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]
